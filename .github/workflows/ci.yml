name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true
      - run: uv run --frozen pytest tests/contracts

  compat:
    name: Compatibility locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true
      - run: uv run --frozen pytest tests/compat
      - run: scripts/dev/verify-crm-contract

  ruff:
    name: Python lint, format and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: >-
          uv run --frozen mypy
          apps/esan_gbos/esan_gbos/domain
          services/observer/contract_check.py
          fixtures/gate1/generate.py
          fixtures/kingdee/gate1/mock.py

  compose-config:
    name: Compose static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: >-
          docker compose
          --env-file infra/dev/.env.example
          -f infra/dev/compose.yml
          --profile core
          --profile observer
          config --quiet
      - run: >-
          bash -n
          scripts/dev/bootstrap
          scripts/dev/build-custom-image
          scripts/dev/license-sbom
          scripts/dev/purge-local-data
          scripts/dev/secret-scan
          scripts/dev/security-scan
          scripts/dev/status
          scripts/dev/teardown
          scripts/dev/verify-crm-contract

  app-materialization:
    name: Gate 1 app materialization (fail closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Require the Frappe app and Vue/Playwright workspaces
        run: |
          test -f apps/esan_gbos/pyproject.toml
          test -f apps/esan_gbos/esan_gbos/hooks.py
          FRONTEND_PACKAGE="$(find apps/esan_gbos -path '*/node_modules' -prune -o -name package.json -print -quit)"
          test -n "${FRONTEND_PACKAGE}"
          python - "${FRONTEND_PACKAGE}" <<'PY'
          import json
          import pathlib
          import sys

          package_path = pathlib.Path(sys.argv[1])
          package = json.loads(package_path.read_text(encoding="utf-8"))
          dependencies = package.get("dependencies", {}) | package.get("devDependencies", {})
          assert "vue" in dependencies, "Vue dependency is required"
          scripts = package.get("scripts", {})
          for name in ("lint", "test", "build", "test:e2e"):
              assert name in scripts, f"missing fail-closed package script: {name}"
          assert any(package_path.parent.glob("playwright.config.*")), "Playwright config is required"
          PY

  frappe-vue-playwright:
    name: Python, JSON, Frappe, Vue and Playwright gates
    needs: app-materialization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.13.0"
          check-latest: false
      - name: Python and JSON validation
        run: |
          uv run --frozen pytest
          python - <<'PY'
          import json
          import pathlib

          for path in pathlib.Path(".").rglob("*.json"):
              if not {".git", "node_modules"}.isdisjoint(path.parts):
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Vue unit, build, and Playwright checks
        run: |
          FRONTEND_PACKAGE="$(find apps/esan_gbos -path '*/node_modules' -prune -o -name package.json -print -quit)"
          FRONTEND_DIR="$(dirname "${FRONTEND_PACKAGE}")"
          corepack enable
          corepack install --global pnpm@11.9.0
          test "$(pnpm --version)" = "11.9.0"
          pnpm --dir "${FRONTEND_DIR}" install --frozen-lockfile
          pnpm --dir "${FRONTEND_DIR}" run lint
          pnpm --dir "${FRONTEND_DIR}" run test
          pnpm --dir "${FRONTEND_DIR}" run build
          pnpm --dir "${FRONTEND_DIR}" exec playwright install --with-deps chromium
          pnpm --dir "${FRONTEND_DIR}" run test:e2e

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - run: scripts/dev/secret-scan
      - name: Scan repository history and working tree
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --no-banner --redact --exit-code 1

  security-sbom:
    name: Dependency, license and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Block unapproved high or critical findings
        run: scripts/dev/security-scan
      - name: Generate license inventory and CycloneDX SBOM
        run: scripts/dev/license-sbom "${RUNNER_TEMP}/sbom"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sbom-cyclonedx
          path: |
            ${{ runner.temp }}/sbom/licenses.json
            ${{ runner.temp }}/sbom/sbom.cdx.json
            ${{ runner.temp }}/sbom/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
