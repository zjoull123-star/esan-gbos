<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12372a">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <meta name="description" content="ESAN GBOS 治理型业务操作系统">
    <link
      rel="manifest"
      href="/assets/esan_gbos/frontend/manifest.webmanifest"
    >
    <link
      rel="icon"
      href="/assets/esan_gbos/frontend/icon.svg"
      type="image/svg+xml"
    >
    {% for style in gbos_styles %}
    <link rel="stylesheet" href="{{ style | e }}">
    {% endfor %}
    <title>{{ title | e }}</title>
  </head>
  <body>
    <noscript>ESAN GBOS 需要启用 JavaScript，并保持联网。</noscript>
    <div id="app"></div>
    <script id="gbos-bootstrap" type="application/json">
      {{ gbos_boot | tojson }}
    </script>
    <script
      defer
      src="/assets/esan_gbos/frontend/registerSW.js"
    ></script>
    <script type="module" src="{{ gbos_entry | e }}"></script>
  </body>
</html>
