title = "ESAN GBOS Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Allow only the documented synthetic CI database password format"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s+DB_ROOT_PASSWORD: SYNTHETIC-ci-db-root-[a-f0-9]{8}$''']
paths = ['''^\.github/workflows/frappe-app-smoke\.yml$''']

[[allowlists]]
description = "Allow the frozen non-secret DeepSeek tokenizer catalog version"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''deepseek-utf8-byte-plus-1024-upper-bound-v1''']
paths = ['''^services/model_gateway/runtime\.py$''']

[[allowlists]]
description = "Allow only the explicit synthetic materializer credentials in its unit fixture"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''MaterializerKey_0123456789ABCDEF|MaterializerSecret_0123456789ABCDEF''']
paths = ['''^tests/domain/test_local_pilot_service_identity\.py$''']

[[allowlists]]
description = "Allow only frozen synthetic observation identifiers in identity read tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''observation_id="(?:OBS-EMAIL-0001|event-001)"''']
paths = ['''^tests/(?:integration/test_identity_resolution_offline_e2e|observer/test_local_pilot_read)\.py$''']

[[allowlists]]
description = "Allow only the frozen synthetic projection lease token fixture"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''fence_token="fence-SYNTH-002"''']
paths = [
  '''^tests/local_pilot_runtime/test_model_projection_worker\.py$''',
  '''^tests/infra/test_dev_infrastructure\.py$''',
]

[[allowlists]]
description = "Allow only fixed local retention service URLs in their closed runtime and tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''(?:http://observer-api:8003/internal/v1/retention/(?:tombstones/verify|email-material/register)|assert r"http://observer-api:8003/internal/v1/retention/" in config)''']
paths = [
  '''^(?:scripts/local-pilot/render-config|services/local_pilot_runtime/email_gateway_retention_worker\.py|tests/(?:email_gateway/test_email_gateway_retention_worker|infra/test_email_gateway_runtime_composition|local_pilot_runtime/test_email_gateway_retention_worker)\.py)$''',
  '''^tests/infra/test_dev_infrastructure\.py$''',
]

[[allowlists]]
description = "Allow only the frozen SLA policy idempotency fixture"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''sla-policy-upsert-01''']
paths = ['''^tests/(?:domain/test_bff_v5_email|email_gateway/test_api)\.py$''']

[[allowlists]]
description = "Allow only the frozen email command fence reference fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''(?:FNC|PUB)-01ARZ3NDEKTSV4RRFFQ69G5FAV''']
paths = ['''^tests/(?:domain/test_internal_email_command_publication|domain/test_internal_email_gateway_authority|email_gateway/test_command_authority|email_gateway/test_outbound|email_gateway/test_worker|integration/test_email_send_command_offline_e2e|local_pilot_runtime/test_email_command_publication_worker|local_pilot_runtime/test_email_gateway_command_authority)\.py$''']
