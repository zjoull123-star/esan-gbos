[project]
name = "esan-gbos-tooling"
version = "0.1.0"
description = "Repository-level validation tooling for ESAN GBOS"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema[format]>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
strict = true
show_error_codes = true
