global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Runtime services do not yet expose a proven Prometheus metrics contract.
# Keep this optional profile self-only rather than manufacturing healthy targets.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
