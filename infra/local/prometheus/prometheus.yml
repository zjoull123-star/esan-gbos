global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: identity-resolution
    metrics_path: /internal/v1/metrics/identity-resolution
    authorization:
      type: Bearer
      credentials_file: /run/secrets/agent_api_bearer
    http_headers:
      X-GBOS-Local-Auth-Ref:
        values: ["local-pilot-context-auth-v1"]
      X-Site-ID:
        values: ["gbos.localhost"]
      X-Processing-Purpose:
        values: ["identity_resolution_metrics"]
      X-Request-ID:
        values: ["prometheus-identity-resolution"]
    static_configs:
      - targets: ["observer-api:8003"]
  - job_name: retention-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["retention-scheduler:9101"]
