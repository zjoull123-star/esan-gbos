global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: pilot-ui
    metrics_path: /metrics
    static_configs:
      - targets: ["pilot-ui:8080"]

  - job_name: webhook-ingress
    metrics_path: /metrics
    static_configs:
      - targets: ["webhook-ingress:8000"]

  - job_name: agent-runtime
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-runtime:8002"]
    relabel_configs:
      - target_label: pilot
        replacement: local

  - job_name: local-pilot-alerts
    static_configs:
      - targets: ["prometheus:9090"]
