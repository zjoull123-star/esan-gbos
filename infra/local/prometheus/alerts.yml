groups:
  - name: esan-gbos-local-pilot
    rules:
      - alert: LocalPilotTargetDown
        expr: up{job="agent-runtime"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A required local-pilot runtime target is unavailable.

      - alert: LocalPilotEmergencyStopActive
        expr: gbos_local_pilot_emergency_stop == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: The fail-closed emergency-stop latch is active.

      - alert: LocalPilotConnectorUnexpectedlyEnabled
        expr: gbos_local_pilot_connector_enabled{declared_enabled="false"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: A connector is running without manifest authorization.

      - alert: LocalPilotModelUnexpectedlyEnabled
        expr: gbos_local_pilot_model_enabled{declared_enabled="false"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: The model worker is running without manifest authorization.

      - alert: LocalPilotDatabaseUnavailable
        expr: gbos_local_pilot_dependency_ready{dependency="postgres"} != 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The isolated local-pilot PostgreSQL dependency is unavailable.

      - alert: LocalPilotObjectStoreUnavailable
        expr: gbos_local_pilot_dependency_ready{dependency="object-store"} != 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The isolated local-pilot object store is unavailable.

      - alert: LocalPilotIngestionBacklog
        expr: gbos_local_pilot_ingestion_oldest_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Local-pilot ingestion has a sustained backlog.

      - alert: LocalPilotDeadLetterGrowth
        expr: increase(gbos_local_pilot_dead_letter_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: New local-pilot dead-letter records were created.
