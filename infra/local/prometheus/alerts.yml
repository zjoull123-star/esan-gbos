groups:
  - name: identity-resolution
    rules:
      - alert: IdentityResolverNotReady
        expr: gbos_identity_resolver_ready == 0
        for: 1m
        annotations:
          summary: Identity resolver is not ready
      - alert: IdentityResolverHeartbeatStale
        expr: gbos_identity_resolver_heartbeat_age_seconds > 30
        for: 1m
        annotations:
          summary: Identity resolver heartbeat is stale
      - alert: IdentityResolverBacklogStale
        expr: gbos_identity_resolver_oldest_work_age_seconds > 300
        for: 5m
        annotations:
          summary: Identity resolution backlog is stale
      - alert: IdentityResolverConflict
        expr: gbos_identity_resolver_conflicts > 0
        for: 1m
        annotations:
          summary: Identity resolution has conflicts
      - alert: IdentityResolverLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(gbos_identity_resolver_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        annotations:
          summary: Identity resolver p95 latency is high
